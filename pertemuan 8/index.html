<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Interaktif Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>Formulir Pendaftaran</h2>
    <form id="myForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
      </div>
      <div class="form-group">
        <label for="email">Alamat Email:</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label for="pesan">Pesan:</label>
        <textarea id="pesan" rows="4" placeholder="Tulis pesan di sini..." required></textarea>
      </div>
      <button type="submit">Kirim Data</button>
    </form>
    <div id="result" class="result-box"></div>
    <div class="back-link">
      <a href="../index.html">&laquo; Kembali ke Index Utama</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
