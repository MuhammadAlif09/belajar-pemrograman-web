<!DOCTYPE html>

    <title>Format 3 - Code dan Keyboard</title>

<body>
    <h1>Teks Formatting Bagian 3</h1>

    <h2>Teks Kode di HTML</h2>
    <p>Gunakan <code>code</code> untuk menampilkan potongan kode program.</p>

    <h2>Teks Tombol Keyboard di HTML</h2>
    <p>Gunakan <kbd>kbd</kbd> untuk menandai tombol keyboard, contohnya <kbd>Ctrl</kbd> + <kbd>C</kbd> lalu <kbd>Ctrl</kbd> + <kbd>V</kbd>.</p>
</body>
